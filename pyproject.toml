[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-model-inference-platform"
version = "0.1.0"
description = "Highly available model serving: canary releases with automated analysis, autoscaling on in-flight requests, SLO burn-rate alerts and dashboards."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Darshan Kumar Satpathy" }]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "numpy>=2.0",
  "prometheus-client>=0.21",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.13", "types-PyYAML", "scikit-learn>=1.5"]

[project.scripts]
ifp = "inferplat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.pycodestyle]
max-line-length = 180  # report and message strings; code is formatted at 140

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["drill: canary drills with real servers (slower)"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["inferplat"]
omit = ["*/inferplat/train.py"]
