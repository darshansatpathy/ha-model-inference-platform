apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inference
labels:
  - pairs: {app.kubernetes.io/part-of: inference-platform}
    includeSelectors: false
resources:
  - namespace.yaml
  - security.yaml
  - model-stable.yaml
  - model-canary.yaml
  - gateway.yaml
  - autoscaling.yaml
images:
  - name: ifp
    newName: ghcr.io/darshansatpathy/ha-model-inference-platform
    newTag: 0.1.0
