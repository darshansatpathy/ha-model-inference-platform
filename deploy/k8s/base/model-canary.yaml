apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-canary
  labels: {app.kubernetes.io/name: model-server, app.kubernetes.io/component: canary}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app.kubernetes.io/name: model-server, app.kubernetes.io/component: canary}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app.kubernetes.io/name: model-server, app.kubernetes.io/component: canary}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: model-server
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: model-server, app.kubernetes.io/component: canary}
      containers:
        - name: server
          image: ifp
          args: ["serve"]
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: MODEL_VERSION, value: v2}
            - {name: MAX_INFLIGHT, value: "64"}
            - {name: DRAIN_SECONDS, value: "20"}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 512Mi}
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            # Let endpoints and the gateway's connections move off this pod before SIGTERM.
            preStop:
              exec: {command: ["sleep", "8"]}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: model-canary
  labels: {app.kubernetes.io/name: model-server, app.kubernetes.io/component: canary}
spec:
  selector: {app.kubernetes.io/name: model-server, app.kubernetes.io/component: canary}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: model-canary
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: model-server, app.kubernetes.io/component: canary}
