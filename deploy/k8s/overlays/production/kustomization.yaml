# Production shape: three gateways and model servers spread across zones, rolled out by the
# controller Job against Prometheus.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../rollout
patches:
  - target: {kind: Deployment, name: gateway}
    patch: |
      - {op: replace, path: /spec/replicas, value: 3}
  - target: {kind: HorizontalPodAutoscaler, name: gateway}
    patch: |
      - {op: replace, path: /spec/minReplicas, value: 3}
  - target: {kind: HorizontalPodAutoscaler, name: model-stable}
    patch: |
      - {op: replace, path: /spec/minReplicas, value: 3}
  - target: {kind: Deployment, name: model-stable}
    patch: |
      - {op: replace, path: /spec/replicas, value: 3}
  - target: {kind: Deployment}
    patch: |
      - op: add
        path: /spec/template/spec/topologySpreadConstraints/-
        value:
          maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchExpressions:
              - {key: app.kubernetes.io/part-of, operator: In, values: [inference-platform]}
