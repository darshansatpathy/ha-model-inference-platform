# A single-node kind cluster for the end-to-end test: the locally built image, one gateway
# (so a controller outside the cluster can read its metrics through a port-forward), and no
# HorizontalPodAutoscalers (kind has no metrics pipeline).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/darshansatpathy/ha-model-inference-platform
    newName: ifp
    newTag: e2e
patches:
  - target: {kind: HorizontalPodAutoscaler}
    patch: |
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata: {name: any}
  - target: {kind: Deployment, name: gateway}
    patch: |
      - {op: replace, path: /spec/replicas, value: 1}
  - target: {kind: Deployment}
    patch: |
      - {op: add, path: /spec/template/spec/containers/0/imagePullPolicy, value: Never}
      - {op: replace, path: /spec/template/spec/containers/0/resources/requests/cpu, value: 50m}
