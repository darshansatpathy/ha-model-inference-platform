# Monitoring for the platform, for clusters running the Prometheus Operator (kube-prometheus-stack)
# and Grafana's dashboard sidecar. The rules and dashboards are generated by `ifp generate`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inference
resources:
  - podmonitors.yaml
  - prometheusrule.yaml
configMapGenerator:
  - name: inference-dashboards
    files:
      - dashboards/inference-overview.json
      - dashboards/inference-slo.json
    options:
      disableNameSuffixHash: true
      labels: {grafana_dashboard: "1"}
