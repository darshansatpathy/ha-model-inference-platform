# Scrape every pod rather than the Services, so per-pod in-flight and readiness are visible.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: model-server
  labels: {release: prometheus}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: model-server}
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
      relabelings:
        - {sourceLabels: [__meta_kubernetes_pod_name], targetLabel: pod}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: gateway
  labels: {release: prometheus}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: gateway}
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
      relabelings:
        - {sourceLabels: [__meta_kubernetes_pod_name], targetLabel: pod}
