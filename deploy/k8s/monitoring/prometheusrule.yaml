# Generated by `ifp generate` from slo/slo.yaml. Do not edit.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: inference-slo
  namespace: inference
  labels:
    app.kubernetes.io/part-of: inference-platform
    release: prometheus
spec:
  groups:
  - name: slo-availability
    interval: 30s
    rules:
    - record: slo:sli_error:ratio_rate5m
      expr: sum(rate(gateway_requests_total{code=~"5..|error"}[5m])) / sum(rate(gateway_requests_total[5m]))
      labels: &id001
        service: inference
        slo: availability
    - record: slo:sli_error:ratio_rate30m
      expr: sum(rate(gateway_requests_total{code=~"5..|error"}[30m])) / sum(rate(gateway_requests_total[30m]))
      labels: *id001
    - record: slo:sli_error:ratio_rate1h
      expr: sum(rate(gateway_requests_total{code=~"5..|error"}[1h])) / sum(rate(gateway_requests_total[1h]))
      labels: *id001
    - record: slo:sli_error:ratio_rate2h
      expr: sum(rate(gateway_requests_total{code=~"5..|error"}[2h])) / sum(rate(gateway_requests_total[2h]))
      labels: *id001
    - record: slo:sli_error:ratio_rate6h
      expr: sum(rate(gateway_requests_total{code=~"5..|error"}[6h])) / sum(rate(gateway_requests_total[6h]))
      labels: *id001
    - record: slo:sli_error:ratio_rate1d
      expr: sum(rate(gateway_requests_total{code=~"5..|error"}[1d])) / sum(rate(gateway_requests_total[1d]))
      labels: *id001
    - record: slo:sli_error:ratio_rate3d
      expr: sum(rate(gateway_requests_total{code=~"5..|error"}[3d])) / sum(rate(gateway_requests_total[3d]))
      labels: *id001
    - record: slo:sli_error:ratio_rate30d
      expr: sum(rate(gateway_requests_total{code=~"5..|error"}[30d])) / sum(rate(gateway_requests_total[30d]))
      labels: *id001
    - record: slo:error_budget_remaining:ratio
      expr: 1 - slo:sli_error:ratio_rate30d{service="inference",slo="availability"} / 0.001
      labels: *id001
    - record: slo:objective:ratio
      expr: vector(0.999)
      labels: *id001
    - alert: AvailabilityErrorBudgetBurnFast
      expr: |
        (slo:sli_error:ratio_rate1h{service="inference",slo="availability"} > (14.4 * 0.001) and slo:sli_error:ratio_rate5m{service="inference",slo="availability"} > (14.4 * 0.001))
        or
        (slo:sli_error:ratio_rate6h{service="inference",slo="availability"} > (6 * 0.001) and slo:sli_error:ratio_rate30m{service="inference",slo="availability"} > (6 * 0.001))
      for: 2m
      labels:
        severity: page
        service: inference
        slo: availability
      annotations:
        summary: availability SLO is burning its error budget fast
        description: 'Prediction requests answered without a server error or a gateway failure. Objective 99.900% over 30 days. At the current rate the budget runs out in hours: error ratio over 1h is {{
          with query `slo:sli_error:ratio_rate1h{service="inference",slo="availability"}` }}{{ . | first | value | humanizePercentage }}{{ end }}.'
        runbook_url: https://github.com/darshansatpathy/ha-model-inference-platform/blob/main/docs/runbooks.md#availability-error-budget-burn
    - alert: AvailabilityErrorBudgetBurnSlow
      expr: |
        (slo:sli_error:ratio_rate1d{service="inference",slo="availability"} > (3 * 0.001) and slo:sli_error:ratio_rate2h{service="inference",slo="availability"} > (3 * 0.001))
        or
        (slo:sli_error:ratio_rate3d{service="inference",slo="availability"} > (1 * 0.001) and slo:sli_error:ratio_rate6h{service="inference",slo="availability"} > (1 * 0.001))
      for: 15m
      labels:
        severity: ticket
        service: inference
        slo: availability
      annotations:
        summary: availability SLO is burning its error budget steadily
        description: 'Prediction requests answered without a server error or a gateway failure. Objective 99.900% over 30 days. At the current rate the budget runs out in days: error ratio over 1h is {{
          with query `slo:sli_error:ratio_rate1h{service="inference",slo="availability"}` }}{{ . | first | value | humanizePercentage }}{{ end }}.'
        runbook_url: https://github.com/darshansatpathy/ha-model-inference-platform/blob/main/docs/runbooks.md#availability-error-budget-burn
  - name: slo-latency
    interval: 30s
    rules:
    - record: slo:sli_error:ratio_rate5m
      expr: 1 - ( sum(rate(gateway_request_duration_seconds_bucket{le="0.3"}[5m])) / sum(rate(gateway_request_duration_seconds_count[5m])) )
      labels: &id002
        service: inference
        slo: latency
    - record: slo:sli_error:ratio_rate30m
      expr: 1 - ( sum(rate(gateway_request_duration_seconds_bucket{le="0.3"}[30m])) / sum(rate(gateway_request_duration_seconds_count[30m])) )
      labels: *id002
    - record: slo:sli_error:ratio_rate1h
      expr: 1 - ( sum(rate(gateway_request_duration_seconds_bucket{le="0.3"}[1h])) / sum(rate(gateway_request_duration_seconds_count[1h])) )
      labels: *id002
    - record: slo:sli_error:ratio_rate2h
      expr: 1 - ( sum(rate(gateway_request_duration_seconds_bucket{le="0.3"}[2h])) / sum(rate(gateway_request_duration_seconds_count[2h])) )
      labels: *id002
    - record: slo:sli_error:ratio_rate6h
      expr: 1 - ( sum(rate(gateway_request_duration_seconds_bucket{le="0.3"}[6h])) / sum(rate(gateway_request_duration_seconds_count[6h])) )
      labels: *id002
    - record: slo:sli_error:ratio_rate1d
      expr: 1 - ( sum(rate(gateway_request_duration_seconds_bucket{le="0.3"}[1d])) / sum(rate(gateway_request_duration_seconds_count[1d])) )
      labels: *id002
    - record: slo:sli_error:ratio_rate3d
      expr: 1 - ( sum(rate(gateway_request_duration_seconds_bucket{le="0.3"}[3d])) / sum(rate(gateway_request_duration_seconds_count[3d])) )
      labels: *id002
    - record: slo:sli_error:ratio_rate30d
      expr: 1 - ( sum(rate(gateway_request_duration_seconds_bucket{le="0.3"}[30d])) / sum(rate(gateway_request_duration_seconds_count[30d])) )
      labels: *id002
    - record: slo:error_budget_remaining:ratio
      expr: 1 - slo:sli_error:ratio_rate30d{service="inference",slo="latency"} / 0.01
      labels: *id002
    - record: slo:objective:ratio
      expr: vector(0.99)
      labels: *id002
    - alert: LatencyErrorBudgetBurnFast
      expr: |
        (slo:sli_error:ratio_rate1h{service="inference",slo="latency"} > (14.4 * 0.01) and slo:sli_error:ratio_rate5m{service="inference",slo="latency"} > (14.4 * 0.01))
        or
        (slo:sli_error:ratio_rate6h{service="inference",slo="latency"} > (6 * 0.01) and slo:sli_error:ratio_rate30m{service="inference",slo="latency"} > (6 * 0.01))
      for: 2m
      labels:
        severity: page
        service: inference
        slo: latency
      annotations:
        summary: latency SLO is burning its error budget fast
        description: 'Prediction requests answered within 300 ms at the gateway. Objective 99.000% over 30 days. At the current rate the budget runs out in hours: error ratio over 1h is {{ with query `slo:sli_error:ratio_rate1h{service="inference",slo="latency"}`
          }}{{ . | first | value | humanizePercentage }}{{ end }}.'
        runbook_url: https://github.com/darshansatpathy/ha-model-inference-platform/blob/main/docs/runbooks.md#latency-error-budget-burn
    - alert: LatencyErrorBudgetBurnSlow
      expr: |
        (slo:sli_error:ratio_rate1d{service="inference",slo="latency"} > (3 * 0.01) and slo:sli_error:ratio_rate2h{service="inference",slo="latency"} > (3 * 0.01))
        or
        (slo:sli_error:ratio_rate3d{service="inference",slo="latency"} > (1 * 0.01) and slo:sli_error:ratio_rate6h{service="inference",slo="latency"} > (1 * 0.01))
      for: 15m
      labels:
        severity: ticket
        service: inference
        slo: latency
      annotations:
        summary: latency SLO is burning its error budget steadily
        description: 'Prediction requests answered within 300 ms at the gateway. Objective 99.000% over 30 days. At the current rate the budget runs out in days: error ratio over 1h is {{ with query `slo:sli_error:ratio_rate1h{service="inference",slo="latency"}`
          }}{{ . | first | value | humanizePercentage }}{{ end }}.'
        runbook_url: https://github.com/darshansatpathy/ha-model-inference-platform/blob/main/docs/runbooks.md#latency-error-budget-burn
  - name: inference-operations
    rules:
    - alert: InferenceCanaryErrorsHigh
      expr: sum(rate(gateway_upstream_requests_total{backend="canary",code=~"5..|error"}[5m])) / sum(rate(gateway_upstream_requests_total{backend="canary"}[5m])) > 0.02 and sum(rate(gateway_upstream_requests_total{backend="canary"}[5m]))
        > 1
      for: 2m
      labels:
        severity: page
        service: inference
      annotations:
        summary: The canary is failing more than 2% of its requests
        description: Set the canary weight to 0 (the rollout controller does this on its own when it is running).
        runbook_url: https://github.com/darshansatpathy/ha-model-inference-platform/blob/main/docs/runbooks.md#canary-errors
    - alert: InferenceModelNotReady
      expr: min by (version) (inference_ready) == 0
      for: 5m
      labels:
        severity: ticket
        service: inference
      annotations:
        summary: A model server has not been ready for 5 minutes
        description: 'Version {{ $labels.version }} has a pod that is not ready: check the artifact digest and the pod logs.'
        runbook_url: https://github.com/darshansatpathy/ha-model-inference-platform/blob/main/docs/runbooks.md#model-not-ready
    - alert: InferenceLoadShedding
      expr: sum by (version) (rate(inference_rejected_total{reason="overload"}[5m])) > 0.1
      for: 5m
      labels:
        severity: ticket
        service: inference
      annotations:
        summary: Model servers are refusing requests at their concurrency limit
        description: 'Version {{ $labels.version }} sheds load: the autoscaler is behind or at its maximum.'
        runbook_url: https://github.com/darshansatpathy/ha-model-inference-platform/blob/main/docs/runbooks.md#load-shedding
    - alert: InferenceSaturated
      expr: sum by (version) (inference_inflight_requests) / sum by (version) (inference_max_inflight) > 0.8
      for: 10m
      labels:
        severity: ticket
        service: inference
      annotations:
        summary: Model servers are above 80% of their concurrency limit
        description: Version {{ $labels.version }} runs close to its admission limit for 10 minutes.
        runbook_url: https://github.com/darshansatpathy/ha-model-inference-platform/blob/main/docs/runbooks.md#saturation
    - alert: GatewayCircuitOpen
      expr: max by (backend) (gateway_circuit_open) == 1
      for: 1m
      labels:
        severity: page
        service: inference
      annotations:
        summary: The gateway has stopped sending traffic to a backend
        description: The {{ $labels.backend }} backend failed repeatedly; its traffic goes to the other backend.
        runbook_url: https://github.com/darshansatpathy/ha-model-inference-platform/blob/main/docs/runbooks.md#circuit-open
    - alert: InferenceAutoscalerAtMaximum
      expr: kube_horizontalpodautoscaler_status_current_replicas{horizontalpodautoscaler=~"model-.*"} >= kube_horizontalpodautoscaler_spec_max_replicas{horizontalpodautoscaler=~"model-.*"}
      for: 15m
      labels:
        severity: ticket
        service: inference
      annotations:
        summary: An inference autoscaler has been at its maximum for 15 minutes
        description: '{{ $labels.horizontalpodautoscaler }} cannot add capacity: raise maxReplicas or the node pool.'
        runbook_url: https://github.com/darshansatpathy/ha-model-inference-platform/blob/main/docs/runbooks.md#autoscaler-at-maximum
