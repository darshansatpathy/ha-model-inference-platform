apiVersion: batch/v1
kind: Job
metadata:
  name: rollout
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: rollout-controller
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: rollout
          image: ifp
          args:
            - rollout
            - --store=configmap
            - --namespace=inference
            - --prometheus=http://prometheus-operated.monitoring:9090
            - --steps=5,25,50,100
            - --step-seconds=300
            - --min-requests=1000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
