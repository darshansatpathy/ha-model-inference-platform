apiVersion: v1
kind: ServiceAccount
metadata:
  name: rollout-controller
---
# Only what a rollout needs: the routing ConfigMap and the two model Deployments.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rollout-controller
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [gateway-routing]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [model-stable, model-canary]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rollout-controller
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: rollout-controller}
subjects:
  - {kind: ServiceAccount, name: rollout-controller}
